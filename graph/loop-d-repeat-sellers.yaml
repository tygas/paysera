---
loop: D
name: Repeat Seller Pattern & Recruitment
goal: Atrinkti ir pakviesti 5 patikimus pakartotinius pardavėjus į pirmąją kohortą
category: User Research & Recruitment
plan_source: graph/plan.json
start_day: P7
end_day: P19
parallel_with: [A]
gated_by: [G1]

# ---------------------------------------------------------------------------
# ŠIS LOOP'AS BUVO RIMČIAUSIA v1.0 KLAIDA
#
# v1.0: `query_paysera_transactions` startavo P3 su `dependencies: none`,
# `enrich_seller_profiles` traukė tapatybės patvirtinimo statusą ir AML žymas,
# `recruit_pilot_cohort` nuo P8 siuntė laiškus realiems Paysera klientams —
# o sutikimas buvo renkamas trečiame verbavimo žingsnyje, jau po profiliavimo.
# Teisinis pritarimas (Loop-B) buvo numatytas P14, t. y. 11 dienų po to, kai
# produkcinė klientų duomenų bazė jau buvo užklausta.
#
# Licencijuotoje įstaigoje tai ne tvarkos, o sekos klaida: duomenų tvarkymas
# be užfiksuoto teisinio pagrindo ir AML/KYC duomenų panaudojimas rinkodarai
# (tikslo apribojimo pažeidimas).
#
# Šioje versijoje: startas P7, po G1; KYC/AML ir ginčų laukai iš
# atrankos pašalinti be išimčių; sutikimas — pirmas žingsnis, ne trečias.
# ---------------------------------------------------------------------------

agents:
  - name: query_paysera_transactions
    type: database_query
    start_day: P7
    end_day: P9
    data_class: customer_personal
    depends_on: []
    requires_gate: [G1]
    prompt: |
      PIRMIAUSIA: patikrink, kad G1 sprendime šis tikslas turi užfiksuotą
      teisinį pagrindą. Jei `lawful_basis` = NOT PERMITTED arba jo nėra —
      užklausa nevykdoma ir loop'as sustoja. Tai ne formalumas.

      Užklausa į Paysera sandorių duomenis:

      1. FILTRAI:
         - kategorija: elektronika (telefonai, nešiojamieji kompiuteriai)
         - laikotarpis: paskutinės 90 dienų
         - pakartotiniai sandoriai: >= 2
         - būsena: „completed"

      2. STULPELIAI — tik elgsenos duomenys:
         - seller_ref (pseudonimizuotas, ne vardas)
         - transaction_count (90 d.)
         - avg_transaction_value_EUR
         - first_transaction_date, last_transaction_date
         - buyer_diversity (kiek skirtingų pirkėjų)

      3. ATRANKOS KRITERIJAI:
         - >= 2 užbaigti sandoriai per 90 dienų
         - vidutinė vertė >= 100 EUR
         - buyer_diversity >= 2

      4. KO ČIA NĖRA IR KODĖL:
         v1.0 atranka naudojo AML žymas, chargeback istoriją ir tapatybės
         patvirtinimo statusą. Šie duomenys surinkti vykdant teisinę prievolę
         (AML/KYC), o ne produkto tyrimui, todėl jų
         pakartotinai nenaudojame — tai tikslo apribojimo klausimas
         (BDAR 5 str. 1 d. b p.).

         Atrankai nenaudojami ir sprendimai, išvesti iš AML/KYC, tapatybės
         patvirtinimo, chargeback ar ginčų duomenų. „Tinka / netinka" išvada,
         paremta tokiais laukais, tebėra jų panaudojimas kitu tikslu.

      5. PSEUDONIMIZAVIMAS: darbinis sąrašas — su `seller_ref`.
         Tikri kontaktai atsiranda tik `recruit_pilot_cohort` žingsnyje ir
         tik tiems, kas patys sutiko.

      IŠVESTIS: CSV su atrinktais pardavėjais, rikiuota pagal transaction_count.

    input:
      database: paysera_transactions
      g1_precondition: "lawful_basis(query_paysera_transactions) != NOT PERMITTED"
      filters:
        category: electronics
        time_window_days: 90
        min_repeat_transactions: 2
        transaction_status: completed
      inclusion_criteria:
        min_transactions: 2
        min_avg_value_EUR: 100
        min_buyer_diversity: 2
    output_schema: |
      - seller_ref: string (pseudonimizuotas)
      - transaction_count: integer
      - avg_transaction_value_EUR: float
      - first_transaction_date: YYYY-MM-DD
      - last_transaction_date: YYYY-MM-DD
      - buyer_diversity_count: integer
      - rank: integer

    success_criteria:
      minimum: 20
      target: 50
      stretch: 100

    owner: "Data komanda (užklausa) + Eimantas"

  # -------------------------------------------------------------------------
  - name: enrich_seller_profiles
    type: data_enrichment
    start_day: P9
    end_day: P11
    data_class: customer_personal
    depends_on: [query_paysera_transactions]
    requires_gate: [G1]
    prompt: |
      Iš top 20 pardavėjų surink TIK tai, ko reikia kvietimui išsiųsti ir
      tinkamumui įvertinti. Duomenų minimizavimas čia yra reikalavimas,
      o ne rekomendacija.

      1. KONTAKTAS (tik pasirinktam kanalui):
         - Pageidaujamas kanalas (el. paštas arba žinutė programėlėje)
         - Kalba (LT / EN / RU)

      2. ELGSENA (iš sandorių, kuriuos jau turime):
         - Kokias elektronikos kategorijas parduoda dažniausiai
         - Kainų intervalas
         - Aktyvumo dažnis

      3. TINKAMUMAS PILOTUI:
         - Ar aktyvus per pastarąsias 30 dienų
         - Ar kategorija atitinka piloto apimtį

      KO NERENKAME (v1.0 rinko visa tai):
      - Telefono numerio „jei pasidalinta" — kvietimui jo nereikia
      - IP nustatytos laiko juostos — profiliavimas be tikslo
      - Profilio užpildymo procento, avataro, viešos biografijos —
        „rūpestingumo rodikliai", kurie tėra spėjimas
      - Susirašinėjimo su pirkėjais žurnalų — svetimas turinys
      - Tapatybės patvirtinimo statuso — AML/KYC tikslas, ne šis
      - Atsakymo greičio ir pristatymo trukmės — įdomu, bet kvietimui
        nereikalinga; renkama tik jei G1 tai atskirai leidžia

      TAISYKLĖ: jei laukas neatsako į klausimą „ar galiu jam išsiųsti
      kvietimą ir ar jis tinka pilotui" — jis nerenkamas.

      IŠVESTIS: minimalus profilis + eiliškumas kvietimams.

    input:
      seller_list: "[iš query_paysera_transactions, top 20]"
      g1_precondition: "lawful_basis(enrich_seller_profiles) != NOT PERMITTED"
      minimisation_rule: "tik kvietimui ir tinkamumui būtini laukai"

    output_schema: |
      - seller_ref: string
      - preferred_channel: "email" | "in_app"
      - preferred_language: "lt" | "en" | "ru"
      - common_category: string
      - avg_price_range_EUR: string
      - active_last_30d: bool
      - pilot_fit_score: float (0–10)
      - fit_score_components: [string]   # kad įvertis būtų paaiškinamas
      - outreach_priority: integer

    success_criteria:
      minimum: 12
      target: 20
      stretch: 20

    owner: "Eimantas + Paysera data komanda"

  # -------------------------------------------------------------------------
  - name: recruit_pilot_cohort
    type: outreach + consent_management
    start_day: P11
    end_day: P17
    data_class: customer_personal
    depends_on: [enrich_seller_profiles]
    requires_gate: [G1]
    prompt: |
      SEKA: sutikimas PIRMAS, dalyvavimas — po jo.
      v1.0 čia sutikimas buvo trečias punktas, jau po kvietimų ir
      profiliavimo. Dabar be sutikimo nėra nei skambučio, nei duomenų
      naudojimo pilote.

      1. KVIETIMŲ SEKA:
         - P11: kvietimas pasirinktu kanalu
         - P13: vienas priminimas, jei neatsako
         - P15: paskutinis kontaktas
         - Antro kanalo bandymo NĖRA, jei žmogus neatsakė pirmuoju:
           tylėjimas nėra kvietimas bandyti kitur

      2. KVIETIMO JUODRAŠTIS (galutinę versiją tvirtina G1):
         ---
         Tema: Kviečiame išbandyti naujus Paysera pardavimo įrankius

         Sveiki,

         kuriame Paysera Classifieds — nemokamą skelbimų platformą, kurioje
         AI padeda iš nuotraukos sukurti skelbimą. Ieškome 5 pardavėjų,
         kurie ją išbandytų pirmieji.

         Ką tai reiškia jums:
         - viena 30 min konsultacija piloto pradžioje
         - pardavimas taip, kaip įprastai
         - 25 EUR cashback už pirmą pardavimą per platformą

         Platforma yra ir liks nemokama pardavėjams.

         Jei sutinkate, paspauskite [nuoroda] — ten pamatysite, kokius
         duomenis naudosime, kiek laiko juos saugosime ir kaip bet kada
         atšaukti sutikimą.

         Jei neatsakysite, daugiau nerašysime.

         Pagarbiai,
         Paysera Classifieds komanda
         ---

         PASTABA DĖL FORMULUOTĖS: v1.0 kvietime buvo „pirmos 2 savaitės
         nemokamai" — tai reiškia, kad vėliau bus mokama. Paysera
         Classifieds pagal apibrėžimą yra nemokama platforma (Task.md).
         Pažadas, kurio produktas neduoda, yra klaidinantis pranešimas
         klientui — reguliuojamoje įstaigoje to nedarome.

      3. SUTIKIMAS (prieš bet kokį tolesnį veiksmą):
         - Ką tiksliai naudosime ir kokiu tikslu
         - Kiek laiko saugosime
         - Kaip atšaukti
         - Atskiras sutikimas konsultacijos įrašymui, jei jis bus įrašomas
         - Sutikimo data ir versija fiksuojama

      4. PATVIRTINIMAS:
         - Patvirtinimo laiškas su prisijungimo nuoroda
         - Įžanginio skambučio laikas

      SKATINIMAS: 25 EUR, nekintantis. Jei nepavyksta surinkti kohortos,
      plečiame tinkamų pardavėjų sąrašą ir laiką, o ne didiname sumą.
      Bet koks pakeitimas grįžta per G1.

      IŠVESTIS: verbavimo žurnalas + patvirtinta kohorta.

    input:
      candidate_list: "[iš enrich_seller_profiles, top 20]"
      outreach_text: "[iš G1: approved_outreach_text_lt]"
      consent_text: "[iš G1: approved_consent_text]"
      recruitment_target: 5
      recruitment_backup: 3
      incentive_eur: 25
      max_reminders: 1

    output_schema: |
      - seller_ref: string
      - contact_channel: string
      - contacted_at: YYYY-MM-DD HH:MM
      - response_status: "invited" | "reminded" | "confirmed" | "declined" | "no_response"
      - consent_obtained: bool
      - consent_version: string
      - consent_date: YYYY-MM-DD
      - recording_consent: bool
      - contact_email: string   # tik jei consent_obtained = true
      - onboarding_link_sent: bool
      - kickoff_call_scheduled: bool
      - cohort_status: "ready" | "pending_response" | "declined"

    success_criteria:
      minimum: "4 patvirtinti su sutikimu"
      target: "5 patvirtinti su sutikimu"
      stretch: "7 (su atsarginiais)"

    owner: "Eimantas (komunikacija) + Paysera (pranešimai programėlėje)"

  # -------------------------------------------------------------------------
  - name: analyze_cohort_profile
    type: data_synthesis
    start_day: P18
    end_day: P19
    data_class: customer_personal
    depends_on: [recruit_pilot_cohort]
    requires_gate: [G1]
    prompt: |
      Iš patvirtintos kohortos (tik tie, kas davė sutikimą) sudaryk
      kohortos aprašą piloto UX sprendimams.

      1. KOHORTOS SUDĖTIS:
         - Kategorijos, kuriomis prekiauja
         - Kainų intervalai
         - Aktyvumo dažnis
         - Regionas — tik tiek, kiek reikia, ir tik jei sutikta

      2. VEIKLOS POBŪDIS:
         - Kiek prekių per mėnesį
         - Reguliariai ar protrūkiais
         - Verslas ar papildoma veikla

      3. SKAUSMO TAŠKŲ ATITIKIMAS:
         - Ar jų elgsena atitinka Loop-A rastas temas?
         - Kur nesutampa? Nesutapimas yra svarbesnis radinys nei sutapimas.

      4. ATRANKOS APRIBOJIMAI:
         - AML/KYC, tapatybės patvirtinimo ir ginčų duomenys nenaudojami
         - Iš šių duomenų išvesti tinkamumo sprendimai taip pat nenaudojami

      DRAUDIMAI:
      - Nerašyk „vidutinis amžius 36", jei amžiaus duomenų nerinkome.
      - Kiekvienas skaičius turi turėti šaltinį ir faktinį imties dydį (n).
      - Faktinė maža kohorta yra kokybinė imtis. Vidurkiai pateikiami kaip
        šios kohortos aprašymas, o ne kaip rinkos statistika.

      IŠVESTIS: kohortos aprašas + personos piloto UX'ui.

    input:
      confirmed_cohort: "[iš recruit_pilot_cohort, tik consent_obtained = true]"
      enrichment_data: "[iš enrich_seller_profiles]"

    output_schema: |
      cohort_summary:
        size: integer
        sample_note: "faktinis n — kokybinė imtis, ne rinkos statistika"
        avg_transactions_per_month: {value: float, n: integer}
        avg_item_value_EUR: {value: float, n: integer}
        primary_categories: [string]
        geographic_spread: [string]   # tik su sutikimu
      seller_personas:
        - persona_name: string
          count: integer
          typical_behavior: string
          likely_friction_points: [string]
          motivation_for_pilot: string
          derived_from: [seller_ref]
      alignment_with_loop_a:
        matches: [string]
        mismatches: [string]
      cohort_risk_assessment: "low" | "medium"

    success_criteria:
      minimum: "kohortos aprašas dokumentuotas"
      target: "aprašas + 2–3 personos + palyginimas su Loop-A"
      stretch: "personos su citatomis iš verbavimo pokalbių (su sutikimu)"

    owner: "Eimantas + Claude (dėsningumų sintezė)"

exit_conditions:
  completion:
    - metric: eligible_sellers
      minimum: 20
      target: 50
      stretch: 100

    - metric: profiles_enriched
      minimum: 12
      target: 20
      stretch: 20

    - metric: cohort_confirmed
      minimum: 4
      target: 5
      stretch: 7

    - metric: cohort_profile_documented
      direction: binary
      minimum: "sudėtis ir kategorijos"
      target: "aprašas + personos + palyginimas su Loop-A"

  binary_requirements:
    - id: no_query_before_g1
      description: "Jokios užklausos į klientų duomenis prieš uždarant G1"
      substitute_allowed: false
    - id: consent_before_participation
      description: "Sutikimas gaunamas prieš dalyvavimą ir prieš duomenų naudojimą pilote"
      substitute_allowed: false
    - id: no_kyc_aml_reuse
      description: "AML/KYC, tapatybės ir ginčų duomenys bei iš jų išvesti sprendimai atrankai nenaudojami"
      substitute_allowed: false

  timeline:
    start_day: P7
    deadline: "P19 pabaiga"
    warning_threshold: "P14 — jei patvirtinta < 3"

  escalation:
    if_behind_schedule: |
      - P13: < 20 tinkamų pardavėjų → plėsti filtrus (žemesnė vidutinė vertė
        arba 1 sandoris per 90 d.). Filtrų keitimas fiksuojamas ir
        praneša Compliance.
      - P15: < 3 patvirtinti → plėsti kandidatų sąrašą nuo 20 iki 40 ir
        pridėti asmeninį kvietimą per Paysera vidinį tinklą.
        Skatinimas NEDIDINAMAS.
      - P17: < 4 patvirtinti → pilotas startuoja su 4, tai fiksuojama
        brief'e kaip apribojimas. Kohorta nepildoma pardavėjais, kurie
        neatitinka atrankos kriterijų.
