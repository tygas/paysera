---
loop: A
name: Domain Expert Interviews
goal: Suprasti pardavėjo ir pirkėjo kelią bei jo trukdžius realiame kontekste
category: Research
plan_source: graph/plan.json
start_day: P7
end_day: P20
parallel_with: [C, D]
gated_by: [G1]
gate_note: >-
  Šis loop'as tvarko fizinių asmenų duomenis (kontaktai iš viešų šaltinių,
  pokalbių įrašai). Jis nestartuoja, kol Loop-B agentas `legal_basis_review`
  neuždaro G1 (P6 pabaiga). v1.0 versijoje šis loop'as startavo P1 ir siuntė
  laiškus nuo P4 — teisinis pagrindas tuo metu dar nebuvo apibrėžtas.

agents:
  - name: find_contacts
    type: web_search + manual_review
    start_day: P7
    end_day: P9
    data_class: public_personal
    depends_on: []
    requires_gate: [G1]
    prompt: |
      Surask 15–20 žmonių, kurie per pastarąsias 7–30 dienų Lietuvoje
      pardavė arba pirko naudotą telefoną ar nešiojamąjį kompiuterį.

      ŠALTINIAI — tik tie, kuriuos G1 sprendime Legal įvardijo kaip leistinus.
      Numatytas sąrašas, kurį reikia patvirtinti:

      1. skelbimu.lt / skelbiu.lt viešos pardavėjų skelbimų istorijos
      2. Facebook „perku–parduodu" grupės (LT elektronikos grupės)
      3. forumas.lt elektronikos pardavimo skyrius
      4. Asmeninis ir Paysera vidinis tinklas (rekomendacijos)

      NENAUDOJAME:
      - LinkedIn kaip naudotų telefonų pardavimo kanalo. v1.0 čia ieškojo
        užklausos „recently sold used phone" LinkedIn'e — Lietuvos naudotos
        elektronikos pardavėjai ten savo sandorių neskelbia.
      - TikTok hashtag'ų kaip pirminio kanalo — nepatikrinta prielaida.
      Jei G1 leidžia, juos galima laikyti atsarginiu kanalu, bet ne pirmu.

      Kiekvienam kontaktui užrašyk:
      - vardas arba viešas vardas platformoje
      - platforma
      - kontakto būdas (viešas profilis / žinutė platformoje)
      - apytikslė sandorio data (7–30 dienų atgal)
      - sandorio tipas: pardavė / pirko
      - prekės kategorija

      RIBOS, kurių laikomasi be išimčių:
      - Renkame tik tai, ko reikia susisiekti. Ne visą profilį.
      - Nesaugome duomenų už G1 nustatyto saugojimo termino ribų.
      - Automatinis rinkimas naudojamas tik ten, kur G1 jį leidžia.

    input:
      category: used_electronics
      market: LT
      min_days_since_activity: 7
      max_days_since_activity: 30
      target_count: 20

    output_schema: |
      - name: string
      - platform: enum[skelbiu.lt, facebook_group, forumas.lt, referral]
      - contact_method: "platform_message" | "email" | "phone"
      - contact_value: string
      - activity_date: YYYY-MM-DD
      - activity_type: "sold" | "bought"
      - product_category: "phone" | "laptop" | "other_electronics"
      - source_permitted_by_G1: bool

    success_criteria:
      minimum: 15
      target: 20
      stretch: 30

    owner: "Eimantas + Claude (paieška, rankinė peržiūra)"

  # -------------------------------------------------------------------------
  - name: schedule_calls
    type: outreach + calendar
    start_day: P9
    end_day: P12
    data_class: public_personal
    depends_on: [find_contacts]
    requires_gate: [G1]
    prompt: |
      Siųsk kvietimus naudodamas TIK G1 patvirtintą formuluotę.
      Žemiau — juodraštis, teikiamas Legal patvirtinti; publikuojama versija
      yra ta, kurią grąžina G1.

      KVIETIMO JUODRAŠTIS (LT):
      ---
      Tema: Klausimas apie jūsų neseniai parduotą [produktas]

      Sveiki,

      esu Eimantas, dirbu prie naujos Paysera skelbimų platformos.
      Mačiau, kad neseniai pardavėte [produktas]. Ieškau žmonių, kurie
      sutiktų 45 min papasakoti apie savo patirtį — nuo skelbimo sukūrimo
      iki mokėjimo ir pristatymo.

      Už pokalbį atsilyginame 20 EUR.

      Pokalbis įrašomas tik jums sutikus; įrašą saugome [G1 nustatytas
      terminas] ir po to ištriname. Sutikimą galite atšaukti bet kada.

      Laisvi laikai: [kalendoriaus nuoroda]

      Pagarbiai,
      Eimantas
      ---

      SEKA:
      1. Kvietimas (ne daugiau kaip 5 per dieną — kad spėčiau atsakyti)
      2. Po 48 h — vienas priminimas, jei neatsako
      3. Antro priminimo nėra. Neatsakymas yra atsakymas.

      SKATINIMO DYDIS NEKINTA tyrimo eigoje. Jei nepavyksta surinkti
      pokalbių, plečiame kanalus ir laiką, o ne didiname sumą: keisdami
      kainą viduryje tyrimo iškraipome imtį ir nevienodai elgiamės su
      anksčiau sutikusiais. Bet koks pakeitimas — per G1 iš naujo.

      Tikslas: 12 patvirtintų pokalbių.

    input:
      contacts_list: "[iš find_contacts]"
      outreach_text: "[iš G1: approved_outreach_text_lt]"
      consent_text: "[iš G1: approved_consent_text]"
      incentive_eur: 20
      reminder_delay_hours: 48
      max_reminders: 1
      daily_send_cap: 5

    output_schema: |
      - contact_id: string
      - scheduled_date: YYYY-MM-DD HH:MM
      - confirmation_status: "confirmed" | "pending" | "declined" | "no_response"
      - recording_consent: bool
      - consent_recorded_at: YYYY-MM-DD
      - timezone: string
      - preferred_language: "lt" | "en"

    success_criteria:
      minimum: 10
      target: 12
      stretch: 15

    owner: "Eimantas"

  # -------------------------------------------------------------------------
  - name: conduct_interviews
    type: recorded_call + notes
    start_day: P12
    end_day: P18
    data_class: public_personal
    depends_on: [schedule_calls]
    requires_gate: [G1]
    prompt: |
      Vesk pokalbius pagal `schedule_calls` grafiką.
      Planuojama trukmė 45 min; trumpesnis nei 30 min pokalbis į skaičių
      neįskaičiuojamas.

      ĮŽANGA (5 min):
      - Prisistatymas, tikslas
      - Įrašymo sutikimas ŽODŽIU IR ĮRAŠE, prieš pradedant įrašinėti turinį
      - Priminimas: kiek laiko saugosime ir kaip atšaukti sutikimą
      - Jei sutikimo nėra — pokalbis vyksta, bet be įrašo, tik užrašai

      PARDAVIMAS / PIRKIMAS (15–20 min):
      - Kur ir kaip paskelbėte skelbimą? Kas užtruko ilgiausiai?
      - Kaip susitarėte su kita puse?
      - Kaip nustatėte kainą? Su kuo lyginote?
      - Kokios informacijos trūko?

      MOKĖJIMAS IR PRISTATYMAS (10–15 min):
      - Kaip atsiskaitėte? (grynais, pavedimu, kita)
      - Ar bijojote, kad negausite pinigų arba prekės?
      - Kiek užtruko pristatymas?

      PASITIKĖJIMAS IR SUKČIAVIMAS (5–10 min):
      - Ar norėjote susitikti gyvai? Kodėl?
      - Kas jums sukėlė įtarimą arba, priešingai, pasitikėjimą?
      - Ar susidūrėte su bandymu apgauti?

      PABAIGA (5 min):
      - Kas labiausiai trukdė? Kas padėjo?
      - Ko tikėtumėtės iš tokios platformos?

      TAISYKLĖ UŽRAŠAMS: citata užrašuose = tai, ką žmogus tikrai pasakė.
      Perfrazavimas žymimas kaip perfrazavimas. Nesukuriame „tipinės citatos".

    input:
      scheduled_calls: "[iš schedule_calls]"
      recording_tool: "[G1 patvirtinta priemonė]"
      template: structured_interview_checklist

    output_schema: |
      - call_id: string
      - contact_ref: string (pseudonimizuotas)
      - recording_url: string | null
      - recording_consent: bool
      - transcript_text: string
      - notes_markdown: string
      - topics_covered: [platform_friction, payment, trust, logistics, fraud, verification]
      - key_quotes: [ {text: string, verbatim: bool} ]
      - duration_minutes: integer
      - follow_up_needed: bool

    success_criteria:
      minimum: "10 pokalbių, >= 4 temos kiekviename"
      target: "12 pokalbių, >= 5 temos"
      stretch: "15 pokalbių, >= 6 temos"

    owner: "Eimantas"

  # -------------------------------------------------------------------------
  - name: extract_insights
    type: data_synthesis
    start_day: P18
    end_day: P20
    data_class: public_personal
    depends_on: [conduct_interviews]
    requires_gate: [G1]
    prompt: |
      Iš `conduct_interviews` transkriptų ir užrašų.

      1. TEMOS. Kiekvienai temai:
         - kiek pokalbių ją paminėjo (tikras skaičius iš tikro N)
         - 2–3 pažodinės citatos su pokalbio ID
         - sunkumo įvertinimas

         Nagrinėjamos sritys:
         - Platformos trukdžiai: kur skelbė, kiek užtruko, kas erzino
         - Mokėjimo pasitikėjimas: ko bijojo, ką naudotų
         - Pristatymas ir sukčiavimas: kaip tikrino būklę, ar nukentėjo
         - Pasitikėjimo signalai: kas privertė pasitikėti

      2. KRYŽMINIAI DĖSNINGUMAI:
         - Kas kartojasi daugumoje pokalbių → product_must_have
         - Kas pasitaiko pavieniui → nice_to_have
         - Kas nepasitaiko visai → out_of_scope

      3. PERSONOS JUODRAŠTIS iš tikrų pokalbių, ne iš prielaidų.

      DRAUDIMAI:
      - Nerašyk temos, kurios nėra transkripte.
      - `mentions` privalo sutapti su tikru pokalbių skaičiumi. Jei įvyko
        11 pokalbių, negali atsirasti „12/15 mentions".
      - Kiekvienas skaičius išvestyje turi turėti `denominator` — iš kelių.

    input:
      transcripts: "[iš conduct_interviews]"

    output_schema: |
      themes:
        - name: string
          mentions: integer
          denominator: integer   # privaloma: iš kelių pokalbių
          representative_quotes: [ {text: string, call_id: string, verbatim: true} ]
          severity: "critical" | "high" | "medium" | "low"
      persona_draft:
        name: string
        age_range: string
        seller_type: string
        key_pain_points: [string]
        trust_triggers: [string]
        derived_from_calls: integer
      product_implications: [ {implication: string, evidence_call_ids: [string]} ]

    success_criteria:
      minimum: "temos iš 10 pokalbių"
      target: "temos iš 12 pokalbių + personos juodraštis"
      stretch: "dvi personos (pakartotinis vs pirmą kartą parduodantis)"

    owner: "Eimantas (validacija) + Claude (dėsningumų paieška)"

exit_conditions:
  completion:
    - metric: contacts_identified
      minimum: 15
      target: 20
      stretch: 30

    - metric: interviews_completed
      minimum: 10
      target: 12
      stretch: 15
      source: "Paysera-atsakymas.md — „Pakalbinčiau 10–15 neseniai pardavusių ar pirkusių žmonių“"

    - metric: interview_minutes
      minimum: 30
      target: 45
      stretch: 60

    - metric: topics_per_interview
      minimum: 4
      target: 5
      stretch: 6

    - metric: transcript_accuracy_pct
      minimum: 80
      target: 95
      stretch: 100

    - metric: theme_saturation
      direction: binary
      definition: "paskutiniuose 3 pokalbiuose neatsirado naujų temų"
      required_for_target: true

  binary_requirements:
    - id: recording_consent_before_recording
      description: "Kiekvienas įrašas turi užfiksuotą sutikimą prieš įrašymą"
      substitute_allowed: false

  timeline:
    start_day: P7
    deadline: "P20 pabaiga"
    warning_threshold: "P12 — jei patvirtinta < 8 pokalbių"

  escalation:
    if_behind_schedule: |
      - P12: < 8 patvirtintų pokalbių → plečiame kanalus (papildomos FB grupės,
        rekomendacijos per Paysera vidinį tinklą), NE didiname skatinimo.
      - P15: < 8 įvykusių pokalbių → trumpiname iki 30 min formato ir
        keliame prioritetą pardavėjams (ne pirkėjams).
      - P18: < 10 įvykusių pokalbių → Loop-A pabaiga slenka į P22,
        Loop-E startas slenka į P23, CEO sprendimas — į P29.
        Loop-E netrumpinamas: trumpinama apimtis, o ne peržiūra.
