---
loop: E
name: Synthesis & Pilot Brief
goal: Iš A+B+C+D rezultatų sudėti vieną brief'ą, kuriame kiekvienas teiginys turi šaltinį
category: Documentation & Strategy
plan_source: graph/plan.json
start_day: P21
end_day: P25
parallel_with: none
gated_by: [G1, G2]
gate_note: >-
  DU VARTAI, NE VIENI. Iki 2026-08-16 čia buvo tik G2. Trys iš keturių šio
  loop'o agentų tvarko klientų asmens duomenis (personos, brief'as iš Loop-D
  kohortos ir Loop-A pokalbių). G2 yra piloto apimties patvirtinimas —
  komercinis sprendimas. Jis nėra ir negali būti teisinis pagrindas fizinio
  asmens duomenims tvarkyti. Tai G1, Loop-E lygiai taip pat kaip Loop-A ir
  Loop-D.

  Praktikoje seka buvo saugi (G1 uždaromas P6, Loop-E startuoja P21), todėl
  tai buvo modelio, o ne vykdymo klaida. Bet grafas yra kontrolė: jei grafikas
  kada nors suspaudžiamas, niekur nebuvo užfiksuota, kad Loop-E apskritai
  priklauso nuo G1.

depends_on_loops: [loop_a, loop_b, loop_c, loop_d]

depends_on_completion:
  loop-a: "extract_insights baigtas (P20)"
  loop-b: "map_to_pilot_scope baigtas, G2 uždarytas arba atviri punktai surašyti (P15)"
  loop-c: "quality_check_outputs baigtas (P15)"
  loop-d: "analyze_cohort_profile baigtas (P19)"

# ---------------------------------------------------------------------------
# PAGRINDINĖ TAISYKLĖ
#
# v1.0 versijoje šio loop'o prompt'uose buvo IŠ ANKSTO ĮRAŠYTOS IŠVADOS:
#   „Loop-A: 'payment trust' was #2 theme"
#   „Loop-C: 'photo-to-listing v2 scores 7.5/10'"
#   „Išvada: 'Persona matches real cohort — low risk for pilot'"
#   „Išvada: 'Pilot launch is low-risk with documented safeguards'"
# Duomenų dar nebuvo. Agentui buvo nurodyta, ką rasti.
#
# Visos jos pašalintos. Sintezės agentas gauna vietas rezultatams, ne
# rezultatus. Jei duomenys rodo priešingai — brief'as sako priešingai.
# ---------------------------------------------------------------------------

provenance_rule:
  description: >-
    Kiekvienas faktinis teiginys brief'e turi tiksliai vieną šaltinio žymą.
    Teiginys be žymos blokuoja brief'ą — tai binary reikalavimas, ne pastaba.
  tags:
    "[A:n]": "Iš Loop-A, n pokalbių. n privalo sutapti su tikru transkriptų skaičiumi."
    "[B]": "Iš Loop-B, su dokumento citata arba patvirtinusio asmens vardu."
    "[C]": "Iš Loop-C matavimo, su imties dydžiu."
    "[D]": "Iš Loop-D užklausos, su data."
    "[EXT:<url>]": "Išorinis viešas šaltinis. Nuoroda turi veikti ir turėti datą."
    "[HYPOTHESIS]": "Dar ne įrodymas. Rašoma kaip hipotezė, niekada būtuoju laiku."
    "[TBD]": "Sąmoningai neužpildyta vieta."

agents:
  - name: synthesize_all_outputs
    type: data_aggregation
    start_day: P21
    end_day: P22
    data_class: customer_personal
    depends_on: []
    requires_gate: [G1, G2]
    prompt: |
      Sujunk keturių loop'ų rezultatus į vieną struktūrą.

      ĮVESTIS:
      1. Loop-A `extract_insights`: temos su mentions/denominator, citatos, persona
      2. Loop-B `map_to_pilot_scope`: taisyklės su šaltiniais, atviri punktai, parašas
      3. Loop-C `quality_check_outputs`: matavimai, imtis, rekomenduota versija
      4. Loop-D `analyze_cohort_profile`: kohortos aprašas, personos

      SINTEZĖS KLAUSIMAI — atsakyk pagal duomenis, ne pagal lūkestį:

      1. Personos:
         - Kokia persona matyti Loop-A pokalbiuose?
         - Kokia yra faktinė Loop-D kohorta?
         - Ar jos sutampa? Jei ne — kuo skiriasi ir ką tai reiškia pilotui?
         Nesutapimas yra vertingesnis radinys nei sutapimas. Jei kohorta
         neatitinka personos, tai rašoma, o ne glaistoma.

      2. Skausmo taškai ir sprendimai:
         - Kurios Loop-A temos turi Loop-B patvirtintą arba Loop-C ištestuotą
           atsaką?
         - Kurios NETURI? Šis sąrašas eina į brief'ą kaip spraga.

      3. Srauto parengtis:
         - Ką rodo Loop-C matavimai su savo imtimi?
         - Ar tai pakanka pilotui? Jei ne — kokia rankinė atsarga reikalinga?

      4. Rizika:
         - Kohortos rizika pagal Loop-D
         - Teisinė parengtis pagal Loop-B, ĮSKAITANT atvirus punktus
         - Bendras vertinimas: išvada formuluojama TIK iš aukščiau esančių
           duomenų. Jei G2 neuždarytas, rizika negali būti „žema".

      IŠVESTIS: viena struktūra + 1 psl. santrauka. Kiekvienas teiginys su žyma.

    input:
      loop_a_insights: "graph/output/loop-a/insights.json"
      loop_b_checklist: "graph/output/loop-b/pilot_checklist.json"
      loop_b_open_items: "graph/output/loop-b/pilot_checklist.json#open_items"
      loop_c_metrics: "graph/output/loop-c/quality_report.md"
      loop_d_cohort: "graph/output/loop-d/cohort_profile.json"

    output_schema: |
      unified_context:
        interview_themes:
          - name: string
            mentions: integer
            denominator: integer
            severity: string
            product_response: string | "NONE — spraga"
            provenance: string
        persona_alignment:
          ideal_from_research: {name, type, pain_points, derived_from_calls}
          real_from_cohort: {name, type, pain_points, n}
          matches: [string]
          mismatches: [string]
        workflow_validation:
          quality_score: {value: float, sample_size: integer}
          ready_for_pilot: bool
          manual_fallback_needed: bool
        legal_readiness:
          rules_count: integer
          g2_closed: bool
          approver: string | null
          open_items: [string]
        cohort_readiness:
          seller_count: integer
          attrition_risk: "low" | "medium" | "high"
        gaps:
          - {theme: string, why_unaddressed: string}
      overall_risk:
        level: "low" | "medium" | "high"
        derived_from: [string]
      executive_summary: string
      untagged_claims: [string]   # privalo būti tuščias

    success_criteria:
      minimum: "visi 4 loop'ų rezultatai integruoti"
      target: "integracija + 1 psl. santrauka + spragų sąrašas"
      stretch: "papildomai rizikos matrica"

    owner: "Claude (sintezė) + Eimantas (validacija)"

  # -------------------------------------------------------------------------
  - name: create_persona
    type: persona_generation
    start_day: P22
    end_day: P23
    data_class: customer_personal
    depends_on: [synthesize_all_outputs]
    requires_gate: [G1, G2]
    prompt: |
      Sukurk pardavėjo personą IŠ Loop-A pokalbių ir Loop-D kohortos.

      STRUKTŪRA (kiekvienas laukas su žyma ir imtimi):

      # [Personos vardas] — pakartotinis pardavėjas, naudota elektronika

      ## Kas žinoma
      - Amžiaus intervalas — [A:n] arba [TBD], jei nerinkome
      - Vietovė — [D] arba [TBD]
      - Technologinis įgudimas — [A:n]
      - Pardavėjo tipas — [A:n] / [D]

      ## Pardavimo elgsena
      - Dažnis — [D], n=
      - Kategorijos — [D], n=
      - Vidutinė vertė — [D], n=
      - Dabartinis skelbimo kūrimo laikas — [A:n]

      ## Skausmo taškai
      Tik tie, kurie pasirodė pokalbiuose. Prie kiekvieno — kiek iš kiek.

      ## Motyvacija dalyvauti pilote
      Iš verbavimo atsakymų [D], ne iš prielaidos.

      ## Pasitikėjimo signalai
      [A:n]

      ## Prieštaravimai ir abejonės
      [A:n] — tikri, ne numanomi

      ## Ko NEŽINOME
      Atviras sąrašas. Persona be šio skyriaus yra grožinė literatūra.

      DRAUDIMAI:
      - Jokių demografinių duomenų, kurių nerinkome
      - Jokių citatų, kurių niekas nepasakė
      - Jokio „~5 vnt./mėn.", jei tikras vidurkis kitoks

    input:
      interview_data: "[iš Loop-A extract_insights]"
      cohort_data: "[iš Loop-D analyze_cohort_profile]"

    output_schema: |
      persona:
        name: string
        archetype: string
        fields:
          - {field: string, value: string, provenance: string, sample_size: integer}
        unknowns: [string]
        derived_from_calls: integer
        derived_from_cohort: integer

    success_criteria:
      minimum: "1 persona su žymomis ir „ko nežinome" skyriumi"
      target: "1 persona + atitikimo kohortai patikra"
      stretch: "2–3 personos"

    owner: "Claude (generavimas) + Eimantas (validacija)"

  # -------------------------------------------------------------------------
  - name: generate_workflow_checklist
    type: documentation
    start_day: P22
    end_day: P23
    data_class: none
    depends_on: [synthesize_all_outputs]
    requires_gate: [G1, G2]
    prompt: |
      Iš Loop-C srauto ir Loop-B ribų sukurk PARDAVĖJUI skirtą sąrašą:
      „Kaip paskelbti prekę Paysera Classifieds".

      Tai klientui matomas tekstas licencijuotos įstaigos produkte.
      Todėl:
      - Jokių pažadų, kurių produktas neduoda
      - Jokių apsaugos mechanizmų, kurių Loop-B nepatvirtino
      - Jokių tikslumo procentų, kurių Loop-C neišmatavo

      STRUKTŪRA:

      ## 1. Paruošk prekę
      - Nuvalyk įrenginį
      - Pasižiūrėk specifikacijas: gamintojas, modelis, atmintis, spalva, metai
      - Įvertink būklę
      - Patikrink pažeidimus ir ar viskas komplekte

      ## 2. Nufotografuok
      - 3–5 aiškios nuotraukos dienos šviesoje
      - Priekis, nugarėlė, šonai
      - Venk šešėlių ir netvarkingo fono
      - Jei turi — dėžutė, kroviklis

      ## 3. Įkelk ir peržiūrėk
      - Pasirink kategoriją
      - Įkelk nuotraukas
      - PERŽIŪRĖK AI sugeneruotą pavadinimą ir aprašymą
      - Pataisyk, kas netikslu

        SVARBU: v1.0 čia buvo parašyta „our AI nails it 80% of the time".
        Toks skaičius klientui rodomas tik jei jis pamatuotas [C] ir tik su
        imtimi. Kitu atveju rašoma paprastai: „AI pasiūlymas yra juodraštis.
        Prieš skelbiant peržiūrėk — už skelbimo turinį atsakai tu."

      ## 4. Kaina
      - Peržiūrėk siūlomą intervalą
      - Nustatyk savo kainą
      - Palyginimui — LT skelbimų portalai
        (v1.0 siūlė lyginti su Vinted / eBay — tai ne ta rinka)

      ## 5. Teisė ir sauga
      - Patvirtink: prekė ne vogta
      - Patvirtink: prekė ne klastotė
      - Patvirtink: aprašymas atitinka tikrovę
      - [B] Susipažink su piloto sąlygomis — tekstas iš Loop-B, ne mūsų

      ## 6. Paskelbk ir stebėk
      - Paskelbk
      - Stebėk užklausas programėlėje

      ## Kai atsiranda pirkėjas
      - [B] Mokėjimo ir pristatymo eiga — TIK ta, kurią patvirtino Loop-B.
        Jei apsaugotas mokėjimas dar nepatvirtintas, šis skyrius lieka
        [TBD] ir pardavėjui nerodomas.

      ## DUK
      Bent 5 klausimai. Atsakymai — tik apie tai, ką produktas tikrai daro.

    input:
      photo_to_listing_workflow: "[iš Loop-C]"
      legal_bounds: "[iš Loop-B map_to_pilot_scope — klientui matomos taisyklės]"
      g2_status: "[iš Loop-B]"

    output_schema: |
      workflow_checklist:
        title: string
        steps:
          - {step_number: integer, title: string, items: [string], tips: [string], warnings: [string]}
        faq: [{question: string, answer: string, provenance: string}]
        blocked_sections: [string]   # skyriai, laukiantys [B] patvirtinimo

    success_criteria:
      minimum: "6 žingsnių sąrašas"
      target: "detalus sąrašas + 5 DUK + pažymėti blokuoti skyriai"
      stretch: "papildomai ekrano nuotraukos"

    owner: "Claude (generavimas) + Eimantas (UX validacija)"

  # -------------------------------------------------------------------------
  - name: draft_pilot_brief
    type: executive_document
    start_day: P23
    end_day: P25
    data_class: customer_personal
    depends_on: [synthesize_all_outputs, create_persona, generate_workflow_checklist]
    requires_gate: [G1, G2]
    prompt: |
      Užpildyk `graph/pilot-brief-template.md` tikrais rezultatais.

      TAISYKLĖS:
      1. Šablone esantys [TBD] keičiami DUOMENIMIS arba paliekami [TBD].
         [TBD] galutiniame brief'e nėra klaida — tai sąžiningas atsakymas.
         Išgalvotas skaičius vietoje [TBD] yra klaida.

      2. Kiekvienas faktinis teiginys turi žymą pagal `provenance_rule`.

      3. Pirmajame puslapyje, virš viso kito:
         - Ką matavome ir kokia imtis
         - Kas liko nepatvirtinta (Loop-B atviri punktai)
         - Kokios yra hipotezės, o ne išvados

      4. Apsaugotas mokėjimas ir lėšų laikymas aprašomi kaip [HYPOTHESIS],
         kol Loop-B nepatvirtino. Jokioje vietoje jie nevadinami esama
         Paysera funkcija.

      5. Konkurentai — LT rinka pagal graph/plan.json `market_scope`.
         Bet koks teiginys apie konkurentą turi [EXT:<url>] žymą arba
         nerašomas visai.

      6. Sprendimo klausimas CEO turi būti vienas ir aiškus:
         startuojame pilotą, keičiame apimtį ar sustojame — ir kokių
         įrodymų trūksta kiekvienam variantui.

      IŠVESTIS: `graph/output/loop-e/pilot_brief.md`

    input:
      template: "graph/pilot-brief-template.md"
      synthesis_data: "[iš synthesize_all_outputs]"
      persona: "[iš create_persona]"
      checklist: "[iš generate_workflow_checklist]"

    output_schema: |
      brief:
        title: string
        prepared_by: string
        date: YYYY-MM-DD
        prep_window: "P1–P30"
        live_pilot_window: "L1–L30"
        first_page:
          what_we_measured: [string]
          sample_sizes: {interviews: integer, photos: integer, cohort: integer}
          unconfirmed_items: [string]
          hypotheses: [string]
        sections: {...}
        untagged_claims: [string]     # privalo būti tuščias
        tbd_count: integer            # leidžiama > 0

    success_criteria:
      minimum: "juodraštis su visais skyriais, 0 nepažymėtų teiginių"
      target: "paruoštas vidinei peržiūrai"
      stretch: "paruoštas valdybos pristatymui"

    owner: "Claude (generavimas) + Eimantas (redakcija)"

exit_conditions:
  completion:
    - metric: loop_outputs_integrated
      minimum: 4
      target: 4
      stretch: 4

    - metric: personas
      minimum: 1
      target: 1
      stretch: 3

    - metric: checklist_steps
      direction: higher_better
      minimum: 6
      target: 6
      stretch: 6

    - metric: untagged_claims
      direction: lower_better
      maximum: 0
      target: 0
      stretch: 0
      definition: "Faktiniai teiginiai brief'e be šaltinio žymos. Nulis yra vienintelė praeinanti reikšmė."

    - metric: tbd_count
      direction: informational
      definition: >-
        Kiek [TBD] vietų liko brief'e. Ribos nėra ir nebus: [TBD] yra sąžiningas
        atsakymas, o išgalvotas skaičius jo vietoje — ne. Skaičiuojama tam, kad
        skaitytojas matytų, kiek neužpildyta, o ne tam, kad loop'as kristų.

  binary_requirements:
    - id: provenance_complete
      description: "0 nepažymėtų faktinių teiginių brief'e"
      substitute_allowed: false
    - id: no_prewritten_conclusions
      description: "Sintezės prompt'uose nėra iš anksto įrašytų išvadų"
      substitute_allowed: false

  # CTO ir Legal peržiūros iš čia perkeltos į vartus G3 (2026-08-16).
  # Jos buvo šio loop'o binary reikalavimai su `due_day: P26` — viena diena po
  # to, kai loop'as užsidaro P25. Reikalavimas, kurio terminas vėlesnis už jo
  # savininko pabaigą, neturi savininko: dienos P26–P30 turėjo tris gaires ir
  # nė vieno loop'o, agento ar išėjimo sąlygos.
  #
  # G3 — publikavimo patvirtinimas, uždaromas P26, blokuoja CEO pristatymą.
  # Tai šios repozitorijos pagrindinė taisyklė, įrašyta į struktūrą:
  # generavimas ir publikavimas yra du atskiri žingsniai.

  timeline:
    start_day: P21
    deadline: "P25 pabaiga (juodraštis)"
    g3_review_day: P26
    ceo_decision_day: P27
    warning_threshold: "P23 — jei brief'as dar nepradėtas"

  escalation:
    if_behind_schedule: |
      - P23: sintezė nepradėta → trumpinami priedai, bet ne pirmas puslapis
        ir ne šaltinių žymos.
      - P25: brief'as neparuoštas → CEO pristatymas slenka į P28.
        Peržiūra netrumpinama.
      - P26: peržiūroje randama nepažymėtų teiginių → jie pašalinami arba
        pažymimi [TBD]. Brief'as su nepažymėtais teiginiais neišeina.
      - Bet kuriuo atveju: brief'as, kurio Legal neperžiūrėjo, CEO
        nepristatomas. Alternatyva yra vėlesnė data, ne peržiūros praleidimas.
