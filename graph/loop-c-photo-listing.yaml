---
loop: C
name: Photo-to-Listing Workflow
goal: Patikrinti AI srautą — nuo nuotraukos iki struktūruoto aprašymo ir kainos intervalo
category: Product Engineering
plan_source: graph/plan.json
start_day: P1
end_day: P15
parallel_with: [B]
gated_by: []
gate_note: >-
  Vienintelis loop'as, startuojantis P1 be vartų — būtent todėl, kad jame nėra
  jokių asmens duomenų: naudojami savi įrenginiai, sintetinės nuotraukos ir
  licencijuoti pavyzdžiai. Realių skelbimų nuotraukos iš prekyviečių yra ir
  asmens duomenys, ir trečiųjų šalių turinys — jos į imtį nepatenka.

agents:
  - name: collect_test_photos
    type: data_collection
    start_day: P1
    end_day: P3
    data_class: none
    depends_on: []
    prompt: |
      Surink 10 testinių naudotos elektronikos nuotraukų.
      Tikslas — skirtinga kokybė: ne tik tos, su kuriomis AI tikrai susitvarkys,
      bet ir ribiniai atvejai (neryškios, prasta šviesa, keli rakursai).

      LEIDŽIAMI ŠALTINIAI:
      1. Savi ir kolegų įrenginiai — nufotografuoti specialiai šiam testui
      2. Sintetiškai sugeneruotos nuotraukos
      3. Licencijuotos pavyzdinės bibliotekos (licencija užfiksuojama indekse)

      NELEIDŽIAMA:
      - Nuotraukos, nusiurbtos iš skelbiu.lt, Facebook, Vinted ar eBay skelbimų.
        v1.0 čia buvo įrašyta „Public marketplaces — Vinted, eBay listings".
        Tai svetimas turinys ir kartu asmens duomenys. Testui to nereikia.

      TIKSLINĖ MATRICA — planuojamų 10 nuotraukų pasiskirstymas:
      - Įrenginiai: 5 telefonai, 5 nešiojamieji kompiuteriai
      - Jei surenkamas tik minimumas, proporcijos išlaikomos, o faktinis n užrašomas
      - Būklė: 3 „kaip nauja", 4 „gera", 2 „patenkinama", 1 „prasta"
      - Fotografavimo kokybė: 3 profesionalios, 5 įprastos telefonu, 2 prastos

      Kiekvienai nuotraukai užrašoma ETALONINĖ TIESA (žmogaus, ne AI):
      tikslus modelis, atmintis, spalva, būklė, kainos intervalas ir kuo tas
      intervalas pagrįstas. Be etaloninės tiesos matavimas neturi prasmės.

      IŠVESTIS: graph/output/loop-c/photos/ + photo_index.csv

    input:
      target_count: 10
      devices: {phones: 5, laptops: 5}
      condition_distribution: {mint: 3, good: 4, fair: 2, poor: 1}
      photo_quality_distribution: {professional: 3, consumer: 5, poor: 2}

    output_schema: |
      - photo_id: string
      - source: "own_device" | "synthetic" | "licensed"
      - license_note: string
      - device_type: "phone" | "laptop"
      - device_model: string
      - condition: "mint" | "good" | "fair" | "poor"
      - photo_quality: "professional" | "consumer" | "poor"
      - file_path: string
      - human_ground_truth: {device_model, memory, color, condition, actual_specs, visible_specs, price_range_EUR, price_basis}

    success_criteria:
      minimum: 8
      target: 10
      stretch: 12

    owner: "Eimantas"

  # -------------------------------------------------------------------------
  - name: run_photo_to_listing_ai
    type: ai_workflow_execution
    start_day: P4
    end_day: P12
    data_class: none
    depends_on: [collect_test_photos]
    prompt: |
      Kiekvienai nuotraukai iš `collect_test_photos`:

      1. ĮVESTIS: nuotraukos failas
      2. SRAUTAS:
         - Atpažinimas: koks įrenginys, modelis, atmintis, spalva, būklė
         - Generavimas: iš atpažinimo → pavadinimas ir aprašymas
         - Kainos intervalas: iš modelio ir būklės

      3. IŠVESTIS:
         {
           title: string (<= 100 simbolių),
           description: string (2–3 sakiniai),
           price_range: {min_EUR: int, max_EUR: int},
           condition_detected: "mint" | "good" | "fair" | "poor" | "unknown",
           confidence: float (0–1)
         }

      4. PROMPT'O VERSIJOS:
         - v1: paprastas aprašymo prašymas
         - v2: prekyvietei pritaikytas — būklė, specifikacijos, pasitikėjimo signalai
         - v3: pardavėjo balsu

         Kiekviena versija paleidžiama ant VISŲ nuotraukų, kad palyginimas
         būtų sąžiningas.

      5. PATIKROS:
         - Pavadinimas telpa į 100 simbolių?
         - Ar aprašyme nėra specifikacijų, kurių įrenginys neturi pagal
           prieš paleidimą užrašytą etaloninę tiesą? Teisinga, bet nuotraukoje
           nematoma savybė žymima kaip nepatikrinama, ne kaip haliucinacija.
         - Ar kainos intervalas realus LT rinkai?
         - Ar būklė sutampa su etalonine tiese?

      KAINŲ PALYGINIMAS: prieš testą užfiksuota sintetinė / licencijuota
      kainų lentelė, kurioje nėra skelbimų autorių ar kitų asmens duomenų.
      Gyvi prekyviečių skelbimai šiame negatuotame agente nerenkami.

    input:
      photos_index: "[iš collect_test_photos]"
      ai_pipeline:
        vision_and_generation: "Claude (vaizdo įvestis Messages API) — modelio versija fiksuojama kartu su rezultatais"
        price_inference: "taisyklėmis paremta lentelė (modelis + būklė), kalibruota pagal LT palyginamuosius"
      prompt_versions: 3
      price_comparables: "fiksuota sintetinė / licencijuota testinė lentelė, užrašyta prieš paleidimą"

    output_schema: |
      - photo_id: string
      - model_id: string          # tiksli modelio versija, kad rezultatas būtų atkartojamas
      - prompt_version: "v1" | "v2" | "v3"
      - title: string
      - description: string
      - price_min_EUR: integer
      - price_max_EUR: integer
      - condition_detected: string
      - confidence: float
      - quality_checks:
          title_length_ok: bool
          no_invented_specs: bool
          price_realistic_lt: bool
          condition_match: bool

    success_criteria:
      minimum: "8 nuotraukos, >= 2 prompt'o versijos"
      target: "10 nuotraukų, 3 prompt'o versijos"
      stretch: "12 nuotraukų, 3 versijos + antras nepriklausomas aklas vertinimas"

    owner: "Eimantas (prompt'ai) + Claude (generavimas)"

  # -------------------------------------------------------------------------
  - name: quality_check_outputs
    type: human_review + metrics
    start_day: P13
    end_day: P15
    data_class: none
    depends_on: [run_photo_to_listing_ai]
    prompt: |
      Vertinimas atliekamas AKLAI: vertintojas mato aprašymą ir nuotrauką,
      bet nemato, kuri prompt'o versija jį sugeneravo. Kitaip „v2 laimėjo"
      yra vertintojo lūkestis, o ne matavimas.

      1. RANKINĖ PERŽIŪRA:
         - Ar aprašymas tikslus (atitinka nuotrauką)?
         - Ar aprašymas patrauklus pirkėjui?
         - Ar kaina reali LT rinkoje?
         - Ar aprašyme yra prasimanytų faktų?

      2. MATAVIMAI:
         - title_accuracy: teisingai atpažintų modelių/specifikacijų dalis
         - description_clarity: skaitomumo įvertis
         - price_deviation: vidutinis nuokrypis nuo LT palyginamųjų
         - condition_match: teisingai nustatytos būklės dalis
         - hallucination_rate: aprašymų, kuriuose yra prasimanytų
           specifikacijų, dalis. Tai svarbiausias saugumo rodiklis:
           klaidingas skelbimas reguliuojamoje platformoje yra rizika,
           o ne tik kokybės klausimas.

      3. RIBINIAI ATVEJAI:
         - Neryškios nuotraukos: ar atpažino?
         - Pažeisti įrenginiai: ar teisingai įvertino būklę?
         - Įtartinos klastotės: ar apskritai reagavo?

      4. LAIMĖJUSI VERSIJA:
         - Kurią rekomenduoji ir kodėl, remiantis skaičiais
         - Prie kiekvieno skaičiaus nurodomas faktinis imties dydis (n)
         - Prie išvados pridedama: faktinė maža imtis yra orientacinė, ne
           statistiškai reikšminga

      IŠVESTIS: kokybės ataskaita + prompt'o pasirinkimas su pagrindimu.

    input:
      ai_outputs: "[iš run_photo_to_listing_ai]"
      review_dimensions: [accuracy, clarity, price_realism, hallucination]
      blind_review: true
      comparison_data: "[G1 patvirtinti LT kainų šaltiniai]"

    output_schema: |
      - photo_id: string
      - prompt_version_blind_label: string
      - dimension: string
      - score: integer (1–10)
      - comment: string
      - passes_quality_gate: bool
      metrics_summary:
        sample_size: integer
        overall_title_accuracy_pct: float
        overall_description_clarity: float
        price_deviation_avg_pct: float
        condition_match_rate_pct: float
        hallucination_rate_pct: float
      recommended_prompt_version: string
      recommendation_rationale: string
      statistical_caveat: string

    success_criteria:
      minimum: "8 nuotraukos peržiūrėtos, vidutinis įvertis >= 6/10"
      target: "10 nuotraukų peržiūrėtos, vidutinis įvertis >= 7/10"
      stretch: "vidutinis įvertis >= 8/10 + antras nepriklausomas aklas vertinimas"

    owner: "Eimantas (rankinis vertinimas) + Claude (matavimų automatika)"

exit_conditions:
  completion:
    - metric: test_photos
      minimum: 8
      target: 10
      stretch: 12

    - metric: photos_with_output
      minimum: 8
      target: 10
      stretch: 12

    - metric: prompt_versions
      minimum: 2
      target: 3
      stretch: 3

    - metric: quality_score_of_10
      direction: higher_better
      minimum: 6
      target: 7
      stretch: 8

    - metric: hallucination_rate_pct
      direction: lower_better
      maximum: 5
      target: 0
      stretch: 0
      definition: >-
        Aprašymų, kuriuose yra specifikacijos, kurios įrenginys neturi, dalis.
        Lyginama su etalonine tiese, užrašyta PRIEŠ paleidžiant AI.
      note: >-
        Iki 2026-08-16 šis rodiklis egzistavo tik exit-conditions.json faile:
        nebuvo nei plan.json, nei čia, nei binary reikalavimuose, nei jokioje
        eskalavimo taisyklėje. Loop-C galėjo pasiekti target su visais
        skelbimais, kuriuose prasimanytos specifikacijos. Failo tekste (žr.
        `quality_check_outputs`) jis vadinamas svarbiausiu saugumo rodikliu —
        rodiklis, kuris nieko negali sustabdyti, yra pastaba, ne kontrolė.

        Jis buvo užrašytas `minimum: 5 / target: 0`, t. y. 0 % rezultatas
        reiškė neįvykdytą loop'ą. Dabar naudojamas `maximum`.

    - metric: prompt_version_selected
      direction: binary
      minimum: "viena versija rekomenduota"
      target: "rekomendacija + pagrindimas skaičiais + imties įspėjimas"

  binary_requirements:
    - id: blind_review
      description: "Vertinama nematant, kuri prompt'o versija generavo tekstą"
      substitute_allowed: false
    - id: ground_truth_before_run
      description: "Etaloninė tiesa užrašyta PRIEŠ paleidžiant AI"
      substitute_allowed: false

  timeline:
    start_day: P1
    deadline: "P15 pabaiga"
    warning_threshold: "P8 — jei su v1 dar ištestuota < 5 nuotraukų"

  escalation:
    if_behind_schedule: |
      - P8: < 8 nuotraukų sraute → papildyti sintetinėmis, o ne skelbimų nuotraukomis.
      - P12: < 8 peržiūrų → sutelkti dėmesį į 8 ir dokumentuoti ribinius atvejus.
      - P15: kokybė < 6/10 → tai NĖRA priežastis pratęsti loop'ą. Rezultatas
        įrašomas toks, koks yra, ir keliauja į brief'ą kaip „srautas piloto
        kokybės nepasiekė" su rekomendacija dėl rankinės peržiūros sluoksnio.
      - P15: haliucinacijų dalis > 5 % → Loop-C NEĮVYKDYTAS, nepriklausomai nuo
        kokybės įverčio. Brief'e užrašoma, kad srautas negali generuoti skelbimo
        teksto be žmogaus peržiūros, o pilotas neskelbia AI sugeneruotų
        specifikacijų. Tai taip pat nėra priežastis pratęsti loop'ą.
